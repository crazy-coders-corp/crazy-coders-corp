<!DOCTYPE html>
<html>
<head>
    <title>Asset HTML Compiler</title>
    <style>
        :root { --blue: #1a73e8; --green: #34a853; --red: #d93025; --bg: #f8f9fa; }
        body { font-family: system-ui, sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: #fff; padding: 2.5rem; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; }
        h2 { margin: 0 0 1.5rem; color: #202124; font-weight: 600; }
        .toggle-wrapper { display: flex; align-items: center; justify-content: space-between; background: #eee; padding: 12px 16px; border-radius: 12px; margin-bottom: 20px; cursor: pointer; }
        .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background: #ccc; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background: #fff; transition: .3s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input:checked + .slider { background: var(--blue); }
        input:checked + .slider:before { transform: translateX(20px); }
        .field { margin-bottom: 1.5rem; text-align: left; }
        label { font-size: 0.75rem; font-weight: 700; color: #70757a; text-transform: uppercase; display: block; margin-bottom: 8px; letter-spacing: 0.5px; }
        button, input[type="file"] { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid transparent; font-weight: 600; cursor: pointer; transition: all 0.3s ease; box-sizing: border-box; }
        input[type="file"] { background: #f1f3f4; font-size: 0.8rem; }
        
        #connectBtn { background: #fff; color: var(--blue); border: 2px solid #e8f0fe; margin-bottom: 10px; }
        
        /* Blue Glowing Buttons */
        #connectBtn:hover, #tabBtn:hover { 
            transform: translateY(-3px); 
            border-color: var(--blue);
            box-shadow: 0 10px 30px rgba(26, 115, 232, 0.25); 
        }

        #tabBtn { background: var(--blue); color: #fff; font-size: 1rem; margin-top: 10px; }
        
        /* Red Glowing Debug Button */
        #debugBtn { background: var(--red); color: #fff; font-size: 1rem; margin-top: 10px; border-color: transparent; }
        #debugBtn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(217, 48, 37, 0.35); 
        }
        
        #status { font-size: 0.8rem; font-weight: 700; margin-top: 5px; color: var(--red); text-align: center; }
        .success { color: var(--green) !important; }
        footer { margin-top: 2rem; font-size: 0.7rem; color: #70757a; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Asset HTML Compiler</h2>
        <label class="toggle-wrapper">
            <span style="font-weight:600;font-size:0.9rem;color:#444">Enable Local Assets</span>
            <div class="switch"><input type="checkbox" id="localToggle"><span class="slider"></span></div>
        </label>
        <div id="assetSection" class="field" hidden>
            <label>Assets Folder</label>
            <input type="file" id="folderInput" webkitdirectory directory multiple hidden>
            <button id="connectBtn">Connect Folder</button>
            <div id="status">Folder not connected</div>
        </div>
        <div class="field">
            <label>Main HTML File</label>
            <input type="file" id="htmlInput" accept=".html,.htm">
        </div>
        <button id="tabBtn">Open in New Tab</button>
        <button id="debugBtn" hidden>Open with Debug On</button>
    </div>
    <footer>Made by the Compiler Team of the <a href="https://crazy-coders-corp.pages.dev" target="_blank">CCC</a></footer>

<script>
    let FILE_MAP = {};
    let SIZE_MAP = {};
    const $ = id => document.getElementById(id);

    // Secret code listener
    let secretBuffer = "";
    window.addEventListener('keydown', e => {
        secretBuffer += e.key.toLowerCase();
        if (secretBuffer.includes("debug")) {
            $('debugBtn').hidden = false;
            secretBuffer = "";
        }
        if (secretBuffer.length > 20) secretBuffer = secretBuffer.substring(1);
    });

    const CORE_INTERCEPTOR = `(function(){
        const VFS = window.VFS || parent.VFS || {};
        window.VFS_FAILS = window.VFS_FAILS || []; 
        window.VFS_ERRORS = window.VFS_ERRORS || [];

        window.onerror = (msg, src, line, col, err) => {
            window.VFS_ERRORS.push({ msg, src: src?.split('/').pop(), line, time: new Date().toLocaleTimeString() });
        };
        
        const res = u => {
            if(!u || typeof u !== 'string' || u.startsWith('blob:') || u.startsWith('data:')) return null;
            const full = u.toLowerCase().split(/[?#]/)[0].replace(/^\\.\\//, '');
            const filename = full.split('/').pop();
            
            let hit = VFS[full];
            if(!hit) hit = VFS[filename];

            if(!hit) {
                if(!u.startsWith('http') && !window.VFS_FAILS.includes(u)) window.VFS_FAILS.push(u);
                return null;
            }
            return hit;
        };

        const _f = window.fetch; window.fetch = (u, o) => {
            const l = res(u.toString());
            if(l && o) { delete o.mode; delete o.credentials; }
            return l ? _f(l, o) : _f(u, o);
        };
        const _o = window.XMLHttpRequest.prototype.open;
        window.XMLHttpRequest.prototype.open = function(m, u) { return _o.call(this, m, res(u.toString()) || u, true); };

        const hook = (Proto, Prop) => {
            const desc = Object.getOwnPropertyDescriptor(Proto, Prop);
            if(!desc) return;
            const _set = desc.set;
            Object.defineProperty(Proto, Prop, { set: function(v) { _set.call(this, res(v) || v); }, configurable: true });
        };
        hook(HTMLScriptElement.prototype, 'src');
        hook(HTMLImageElement.prototype, 'src');
        hook(HTMLLinkElement.prototype, 'href');
        hook(HTMLMediaElement.prototype, 'src');

        const _W = window.Worker;
        window.Worker = function(u, o) { return new _W(res(u.toString()) || u, o); };
    })();`;

    const OVERLAY_INJECTION = `(function(){
        const style = document.createElement('style');
        style.textContent = \`
            #ccc-ovl { position: fixed; inset: 0; background: rgba(248,249,250,0.98); backdrop-filter: blur(15px); z-index: 2147483647; color: #202124; font-family: system-ui; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
            #ccc-card { background: #fff; width: 95%; max-width: 1000px; height: 85vh; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #ddd; }
            #ccc-head { padding: 20px 30px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 20px; }
            #ccc-title { font-weight: 900; color: #d93025; font-size: 1.2rem; white-space: nowrap; }
            #ccc-search { flex: 1; padding: 10px 15px; border-radius: 10px; border: 1px solid #ddd; font-size: 0.9rem; outline: none; }
            #ccc-main { flex: 1; padding: 0; overflow-y: auto; background: #fff; }
            table { width: 100%; border-collapse: collapse; table-layout: fixed; }
            th { position: sticky; top: 0; background: #f8f9fa; text-align: left; font-size: 10px; color: #70757a; text-transform: uppercase; padding: 12px 20px; z-index: 10; border-bottom: 1px solid #eee; }
            td { padding: 10px 20px; border-bottom: 1px solid #f1f3f4; font-size: 11px; word-break: break-all; font-family: monospace; }
            .g { color: #34a853; font-weight: 700; } .y { color: #f9ab00; } .r { color: #d93025; font-weight: 700; } .err { background: #fff5f5; color: #d93025; }
            .ccc-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid #ddd; background: #f8f9fa; font-size: 11px; font-weight: 700; cursor: pointer; }
            .ccc-btn.active { background: #202124; color: #fff; }
            .blob-link { color: #1a73e8; text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0; font-family: inherit; font-size: inherit; text-align: left; }
            #ccc-foot { padding: 15px 30px; background: #f8f9fa; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; }
        \`;
        document.head.appendChild(style);

        const div = document.createElement('div');
        div.id = 'ccc-ovl';
        div.innerHTML = \`
            <div id="ccc-card">
                <div id="ccc-head">
                    <div id="ccc-title">DEBUG</div>
                    <input type="text" id="ccc-search" placeholder="Search files or errors...">
                    <div id="ccc-filters">
                        <button class="ccc-btn active" data-filter="all">ALL</button>
                        <button class="ccc-btn" data-filter="r">RED</button>
                        <button class="ccc-btn" data-filter="err">CRASHES</button>
                    </div>
                </div>
                <div id="ccc-main">
                    <table>
                        <thead><tr><th style="width:35%">ASSET PATH</th><th style="width:10%">SIZE</th><th>INFO / BLOB (CLICK FOR PLAINTEXT)</th></tr></thead>
                        <tbody id="ccc-list"></tbody>
                    </table>
                </div>
                <div id="ccc-foot"><div id="ccc-stats"></div><div>F4 TO CLOSE</div></div>
            </div>
        \`;
        document.body.appendChild(div);

        let filter = 'all';
        let query = '';
        
        const fmt = b => {
            if (typeof b !== 'number' || b === 0) return '0 B';
            if (b < 1024) return b + ' B';
            if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
            return (b / 1048576).toFixed(1) + ' MB';
        };

        window.viewVfsBlob = async (url) => {
            try {
                const r = await fetch(url);
                const b = await r.blob();
                if (b.type.includes('javascript') || b.type.includes('css') || b.type.includes('html') || b.type.includes('text') || b.type.includes('json')) {
                    const t = await b.text();
                    const w = window.open();
                    w.document.write('<pre style="white-space:pre-wrap;word-break:break-all;font-family:monospace;padding:20px">' + t.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>');
                    w.document.close();
                } else {
                    window.open(url, '_blank');
                }
            } catch(e) { window.open(url, '_blank'); }
        };

        window.addEventListener('keydown', e => {
            if(e.key === 'F4'){
                e.preventDefault();
                div.style.display = div.style.display === 'flex' ? 'none' : 'flex';
                if(div.style.display === 'flex') render();
            }
        });

        document.getElementById('ccc-search').oninput = e => { query = e.target.value.toLowerCase(); render(); };
        document.querySelectorAll('.ccc-btn').forEach(b => b.onclick = () => {
            document.querySelector('.ccc-btn.active').classList.remove('active');
            b.classList.add('active'); filter = b.dataset.filter; render();
        });

        function render() {
            let h = "", g=0, y=0, r=0, e=0, totalSize=0;
            const VFS = window.VFS || {}; 
            const SIZES = window.VFS_SIZES || {};
            const fails = window.VFS_FAILS || []; const logs = window.VFS_ERRORS || [];

            logs.forEach(l => {
                e++; if(filter !== 'all' && filter !== 'err') return;
                if(query && !l.msg.toLowerCase().includes(query)) return;
                h += \`<tr class="err"><td>RUNTIME ERROR</td><td>\${l.time}</td><td>\${l.msg}</td></tr>\`;
            });

            document.querySelectorAll('[src], [href]').forEach(el => {
                const attr = el.tagName === 'LINK' ? 'href' : 'src';
                const val = el.getAttribute(attr);
                if (val && !val.startsWith('blob:') && !val.startsWith('data:') && !val.startsWith('http') && !val.startsWith('#')) {
                   if (!fails.includes(val)) fails.push(val);
                }
            });

            const keys = Object.keys(VFS).sort();
            const seenBlobs = new Set();
            keys.forEach(k => {
                const isPath = k.includes('/');
                if (!isPath) return;
                const b = VFS[k];
                seenBlobs.add(b);
                g++;
                const s = SIZES[k] || 0;
                totalSize += s;
                if(filter === 'r' || filter === 'err') return;
                if(query && !k.toLowerCase().includes(query)) return;
                h += \`<tr><td class="g">\${k}</td><td>\${fmt(s)}</td><td><button class="blob-link" onclick="viewVfsBlob('\${b}')">\${b}</button></td></tr>\`;
            });
            keys.forEach(k => {
                const b = VFS[k];
                if (seenBlobs.has(b)) return;
                seenBlobs.add(b);
                y++;
                const s = SIZES[k] || 0;
                totalSize += s;
                if(filter === 'r' || filter === 'err') return;
                if(query && !k.toLowerCase().includes(query)) return;
                h += \`<tr><td class="y">\${k}</td><td>\${fmt(s)}</td><td><button class="blob-link" onclick="viewVfsBlob('\${b}')">\${b}</button></td></tr>\`;
            });

            fails.forEach(u => {
                r++; if(filter !== 'all' && filter !== 'r') return;
                if(query && !u.toLowerCase().includes(query)) return;
                h += \`<tr><td class="r">\${u}</td><td>-</td><td class="r">NOT FOUND</td></tr>\`;
            });

            document.getElementById('ccc-list').innerHTML = h;
            document.getElementById('ccc-stats').innerHTML = \`Local Assets: \${g + y} | Missing: \${r} | Crashes: \${e} | Memory: \${fmt(totalSize)}\`;
        }

        if(window.VFS_DEBUG_AUTO) { div.style.display = 'flex'; render(); }
    })();`;

    $('localToggle').onchange = (e) => {
        $('assetSection').hidden = !e.target.checked;
        if(!e.target.checked) { FILE_MAP = {}; SIZE_MAP = {}; $('status').innerText = "Folder not connected"; $('status').className = ""; }
    };

    $('connectBtn').onclick = () => $('folderInput').click();

    $('folderInput').onchange = async (e) => {
        const files = Array.from(e.target.files);
        if(!files.length) return;
        FILE_MAP = {}; SIZE_MAP = {};
        for(const f of files) {
            const rel = f.webkitRelativePath.toLowerCase().split('/').slice(1).join('/');
            const name = f.name.toLowerCase();
            let data = f;
            if (name.endsWith('.js')) {
                const text = await f.text();
                data = new Blob([CORE_INTERCEPTOR + "\n" + OVERLAY_INJECTION + "\n" + text], { type: 'application/javascript' });
            }
            const b = URL.createObjectURL(data);
            FILE_MAP[rel] = FILE_MAP[name] = b;
            SIZE_MAP[rel] = SIZE_MAP[name] = f.size;
        }
        const folderName = files[0].webkitRelativePath.split('/')[0];
        $('status').innerText = `Connected: ${folderName} (${files.length} assets)`;
        $('status').className = "success";
    };

    const handleLaunch = async (autoDebug) => {
        const file = $('htmlInput').files[0];
        if (!file) return alert("Select HTML file.");
        let html = await file.text();
        if ($('localToggle').checked) {
            if (!Object.keys(FILE_MAP).length) return alert("Connect a folder!");
            html = html.replace(/<base\s+href=["']([^"']+)["'][^>]*>?/gi, "");
            Object.keys(FILE_MAP).forEach(name => {
                if (name.includes('.')) {
                    const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                    const re = new RegExp('(?<=["\\\'\\(])' + escaped + '(?=["\\\'\\)?])', 'g');
                    html = html.replace(re, FILE_MAP[name]);
                }
            });
            let injection = `<script>window.VFS_SIZES=${JSON.stringify(SIZE_MAP)};window.VFS=${JSON.stringify(FILE_MAP)};`;
            if(autoDebug) injection += `window.VFS_DEBUG_AUTO=true;`;
            injection += `${CORE_INTERCEPTOR}${OVERLAY_INJECTION}<\/script>`;
            html = injection + html;
        }
        const w = window.open('about:blank', '_blank');
        w.document.write(html);
        w.document.close();
    };

    $('tabBtn').onclick = () => handleLaunch(false);
    $('debugBtn').onclick = () => handleLaunch(true);
</script>
</body>
</html>
